services:
  bot:
    build: .
    env_file: ".env"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: kiasu_user
      POSTGRES_PASSWORD: kiasu_password
      POSTGRES_DB: kiasu_db
    ports:
      - "5432:5432"  # 允许你用本地工具 (DBeaver) 连接查看
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiasu_user -d kiasu_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: